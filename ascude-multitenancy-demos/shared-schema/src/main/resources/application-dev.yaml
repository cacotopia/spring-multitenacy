#开发环境配置
server:
  #端口
  port: 8080

spring:
  config:
    activate:
      on-profile: dev
  #redis配置
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password:      # 密码（默认为空）
      timeout: 6000  # 连接超时时长（毫秒）
      lettuce:
        pool:
          enabled: true        # 需要添加此配置
          max-active: 8
          max-idle: 1000
          max-wait: -1      # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 5       # 连接池中的最小空闲连接
  # 数据源配置
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/mysiteforme?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456

#日志
logging:
  charset:
    console: UTF-8
  config: classpath:log/logback.xml
  file:
    path: D:\log\mysiteforme
  level:
    root: INFO
    com.mysiteforme.admin.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security: TRACE
    org.springframework.cache: DEBUG